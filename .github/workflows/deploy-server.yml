# Deploys the multiplayer server (server/) to Cloudflare whenever server code
# lands on master. Needs repo secret CLOUDFLARE_API_TOKEN.
# Run it by hand from the Actions tab with "Run workflow".
name: Deploy server

on:
  push:
    branches: [master]
    paths: ["server/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: bde850cba97016ca70abc5a9a41cfe1f
          workingDirectory: server
          wranglerVersion: "4"
